<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base redondeada exterior con borde cian -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.8"/>

  <!-- Sombra interior y destello -->
  <rect x="3.5" y="3.5" width="41" height="41" rx="10.5" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Hoja de Currículum Estilizada -->
  <path d="M12 11C12 9.89543 12.8954 9 14 9H27L36 18V37C36 38.1046 35.1046 39 34 39H14C12.8954 39 12 38.1046 12 37V11Z" fill="url(#docGrad)"/>

  <!-- Doblez de la esquina superior derecha -->
  <path d="M27 9V17C27 17.5523 27.4477 18 28 18H36L27 9Z" fill="#94a3b8"/>

  <!-- Líneas de logros ejecutivos en el CV -->
  <rect x="16" y="22" width="16" height="2.2" rx="1.1" fill="#3b82f6"/>
  <rect x="16" y="26.5" width="12" height="2" rx="1" fill="#64748b"/>
  <rect x="16" y="31" width="14" height="2" rx="1" fill="#94a3b8"/>

  <!-- Emblema Rayo Tecnológico de Alto Impacto (Glow) -->
  <path d="M30 18L21 28H27L24 38L35 26H28L30 18Z" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
